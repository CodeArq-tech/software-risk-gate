[package]
name = "risk-gate"
version = "0.1.9"
edition = "2024"
description = "Risk analysis and merge gates for GitHub pull requests"
license = "MIT"

[lib]
name = "risk_gate"
path = "src/lib.rs"

[[bin]]
name = "risk-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
walkdir = "2.5"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-elixir = "0.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.14"
mockito = "1.7"
criterion = "0.5"

[[bench]]
name = "risk_analysis"
harness = false

[profile.release]
strip = true
lto = true
codegen-units = 1
