<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
          color: #0f172a;
        }
        #outro-veil {
          position: absolute;
          inset: 0;
          background:
            radial-gradient(900px 700px at 15% 10%, rgba(59, 130, 246, 0.16), transparent 70%),
            radial-gradient(900px 700px at 90% 15%, rgba(20, 184, 166, 0.14), transparent 70%),
            radial-gradient(900px 700px at 10% 95%, rgba(245, 158, 11, 0.12), transparent 70%),
            radial-gradient(900px 700px at 90% 90%, rgba(244, 63, 94, 0.12), transparent 70%),
            linear-gradient(160deg, #f8fafc 0%, #eef2f9 55%, #f5f3fb 100%);
        }
        #outro-group {
          position: absolute;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
        }
        #outro-lockup {
          display: flex;
          align-items: center;
          gap: 30px;
        }
        #outro-logo {
          width: 120px;
          height: 120px;
          display: block;
        }
        #outro-word {
          font-size: 92px;
          font-weight: 700;
          letter-spacing: -0.035em;
        }
        #outro-tag {
          margin-top: 30px;
          display: flex;
          gap: 0.32em;
          font-size: 44px;
          font-weight: 500;
          letter-spacing: -0.02em;
        }
        #outro-tag span {
          display: inline-block;
        }
        #outro-cta {
          margin-top: 58px;
          font-size: 22px;
          font-weight: 600;
          color: #475569;
          text-transform: uppercase;
          letter-spacing: 0.08em;
        }
        #outro-code {
          margin-top: 16px;
          padding: 22px 34px;
          border-radius: 16px;
          background: #0f172a;
          color: #e2e8f0;
          font-family: "JetBrains Mono", ui-monospace, monospace;
          font-size: 30px;
          box-shadow: 0 24px 48px -18px rgba(15, 23, 42, 0.45);
          font-variant-ligatures: none;
        }
        #outro-code .k {
          color: #7ee787;
        }
        #outro-code .v {
          color: #a5d6ff;
        }
        #outro-url {
          margin-top: 26px;
          font-size: 26px;
          color: #334155;
          font-weight: 500;
        }
      </style>
      <div id="root" data-composition-id="outro" data-width="1920" data-height="1080">
        <div id="outro-veil"></div>
        <div id="outro-group">
          <div id="outro-lockup">
            <svg id="outro-logo" viewBox="0 0 120 120" aria-hidden="true">
              <rect x="0" y="0" width="120" height="120" rx="30" fill="#0f172a" />
              <rect class="outro-bar" x="20" y="72" width="12" height="28" rx="4" fill="#14b8a6" />
              <rect class="outro-bar" x="38" y="62" width="12" height="38" rx="4" fill="#3b82f6" />
              <rect class="outro-bar" x="56" y="50" width="12" height="50" rx="4" fill="#f59e0b" />
              <rect class="outro-bar" x="74" y="38" width="12" height="62" rx="4" fill="#f97316" />
              <rect class="outro-bar" x="92" y="24" width="12" height="76" rx="4" fill="#f43f5e" />
              <line x1="14" y1="56" x2="106" y2="56" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />
            </svg>
            <div id="outro-word">Risk Gate</div>
          </div>
          <div id="outro-tag"></div>
          <div id="outro-cta" data-i18n="outro_cta"></div>
          <div id="outro-code"><span class="k">- uses:</span> <span class="v">CodeArq-tech/software-risk-gate@v0.1.0</span></div>
          <div id="outro-url">github.com/CodeArq-tech/software-risk-gate</div>
        </div>
      </div>
      <script>
        (function () {
          const root = document.querySelector('[data-composition-id="outro"]');
          RG.applyText(root);
          const tag = root.querySelector("#outro-tag");
          RG.t("outro_tag")
            .split(" ")
            .forEach((word) => {
              const s = document.createElement("span");
              s.textContent = word;
              tag.appendChild(s);
            });
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#outro-veil", { opacity: 0 }, { opacity: 1, duration: 0.55, ease: "power2.out" }, 0);
          tl.fromTo("#outro-logo", { scale: 0.6, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.6)" }, 0.35);
          tl.fromTo(".outro-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.45, ease: "power3.out", stagger: 0.07 }, 0.5);
          tl.fromTo("#outro-word", { x: -20, opacity: 0 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.55);
          tl.fromTo("#outro-tag span", { y: 22, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out", stagger: 0.18 }, 1.0);
          tl.fromTo("#outro-cta", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 1.8);
          tl.fromTo("#outro-code", { y: 20, scale: 0.96, opacity: 0 }, { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 1.95);
          tl.fromTo("#outro-url", { y: 12, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 2.35);
          window.__timelines["outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
