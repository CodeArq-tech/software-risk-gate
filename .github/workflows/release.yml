name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - run: cp target/x86_64-unknown-linux-gnu/release/risk-gate risk-gate-x86_64-unknown-linux-gnu
      - run: sha256sum risk-gate-x86_64-unknown-linux-gnu > risk-gate-x86_64-unknown-linux-gnu.sha256
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            risk-gate-x86_64-unknown-linux-gnu
            risk-gate-x86_64-unknown-linux-gnu.sha256
