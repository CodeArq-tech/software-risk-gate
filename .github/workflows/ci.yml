name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Require branch rebased on master
        run: |
          git fetch --no-tags origin master
          if ! git merge-base --is-ancestor origin/master ${{ github.event.pull_request.head.sha }}; then
            echo "::error::This pull request must be rebased on the current master before merging."
            exit 1
          fi
      - run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
      - run: cargo llvm-cov --workspace --all-features --fail-under-lines 95.01
